languages: [Sinhala, Pali, Sanskrit]

description: The "Mooniak Sinhala Plus" glyphset adds common ligated conjuncts (සංයෝග අකුරු sanyoga akuru) for enhanced Sinhala typography.

namespace: sinh

categories:
  Ligated consonant conjuncts:
    # Common ligated consonant conjuncts (සංයෝග අකුරු Sanyoga Akuru)
    kVa: # ක්‍ව (ka + va)
    tTha: # ත්‍ථ (ta + tha)
    tVa: # ත්‍ව (ta + va)
    nTha: # න්‍ථ (na + tha)
    nDa: # න්‍ද (na + da)
    nDha: # න්‍ධ (na + dha)

  Orthographical conjuncts:
    # With modifier signs for each conjunct
    kVi: # ක්‍වි (kVa + iSign)
    kVii: # ක්‍වී (kVa + iiSign)
    tThi: # ත්‍ථි (tTha + iSign)
    tThii: # ත්‍ථී (tTha + iiSign)
    tVi: # ත්‍වි (tVa + iSign)
    tVii: # ත්‍වී (tVa + iiSign)
    nThi: # න්‍ථි (nTha + iSign)
    nThii: # න්‍ථී (nTha + iiSign)
    nDi: # න්‍දි (nDa + iSign)
    nDii: # න්‍දී (nDa + iiSign)
    nDhi: # න්‍ධි (nDha + iSign)
    nDhii: # න්‍ධී (nDha + iiSign)

    nDra: # න්‍ද්‍ර (nDa + raSign)
