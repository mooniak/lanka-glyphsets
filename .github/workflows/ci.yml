name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The npm package + the standard's generated artifacts.
  standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Builds, then runs tests/: the Tamil round-trip and consonant × sign grid,
      # GlyphData, the CLI and the coverage classifier.
      - run: npm test
      # Regenerates every artifact derived from glyphsets/*.yaml and fails if the
      # committed copies drift, or if the recorded standard versions disagree.
      - run: npm run check:drift
