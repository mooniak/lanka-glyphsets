    bii: # බී
    mii: # මී
    mbii: # ඹී
    rii: # රී
    vii: # වී

    # uSign Ligatures (paa-pilla):
    ku: # කු
    gu: # ගු
    nggu: # ඞු
    nyu: # ඤු
    #nyju:
    tu: # තු
    du: # දු
    ndu: # ඳු
    bhu: # භු
