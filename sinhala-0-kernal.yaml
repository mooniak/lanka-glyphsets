languages: [Sinhala]

description: The "Mooniak Sinhala Kernal" glyphs set represents the bare-bones essential glyphset necessary for a functional Sinhala font for general use.

namespace: sinh
Exclude namespace from: [Format controls, Punctuation]

categories:
  Format controls:
    space:
    zerowidthjoiner: # Required special character for shaping connected forms.
      unicode: 0x200D

  Punctuation:
    # Base glyphs out of Sinhala namespace
    space:
    exclam:
    quotedbl:
    numbersign:
    percent:
    quotesingle:
    parenleft:
    parenright:
    asterisk:
    plus:
    comma:
    hyphen:
    period:
    slash:
    colon:
    semicolon:
    less:
    equal:
    greater:
    question:
    bracketleft:
    backslash:
    bracketright:
    underscore:
    periodcentered:
    multiply:
    divide:
    endash:
    emdash:
    quoteleft:
    quoteright:
    quotedblleft:
    quotedblright:
    bullet:

  Letters:
    a:
      unicode: 0x0D85
    aa:
      unicode: 0x0D86
      decompose: [a, aaSign]
    ae:
      unicode: 0x0D87
      decompose: [a, aSign]
    aae:
      unicode: 0x0D88
      decompose: [a, aaSign]
    i:
      unicode: 0x0D89
    ii:
      unicode: 0x0D8A
    u:
      unicode: 0x0D8B
    uu:
      unicode: 0x0D8C
      decompose: [u, vocalicLSign]
    # vocalicR:
    # vocalicRr:
    # vocalicL:
    # vocalicLl:
    e:
      unicode: 0x0D8D
    ee:
      unicode: 0x0D8E
      decompose: [e, alSign]
    ai:
      unicode: 0x0D8F
      decompose: [eSign, e]
    o:
      unicode: 0x0D90
    oo:
      unicode: 0x0D91
    au:
      unicode: 0x0D92
      decompose: [o, vocalicLSign]
    ka:
      unicode: 0x0D9A
      signs: [alSign, iSign, iiSign, raSign, rephSign]
      ligate: [va, ssa]
      touch: [ka, kha, ta, ma, na]
    kha:
      unicode: 0x0D9B
      signs: [alSign, iSign, iiSign, raSign, rephSign]
    ga:
      unicode: 0x0D9C
      signs: [alSign, iSign, iiSign, raSign, rephSign]
      ligate: [dha]
      touch: [ga, gha]
    gha:
      unicode: 0x0D9D
      signs: [alSign, iSign, iiSign, raSign, rephSign]
    # nga:
    ngga:
      unicode: 0x0D9E
      signs: [alSign, iSign, iiSign, raSign, rephSign]
      ligate: [ga]
      touch: [ngga, ka, ga, gha]
    ca:
      unicode: 0x0D9F
      signs: [uSign, uuSign, raSign, rephSign]
      ligate: [ca]
      touch: [ca, cha]
    cha:
      unicode: 0x0DA0
      signs: [alSign, iSign, iiSign, uSign, uuSign, raSign, rephSign]
    ja:
      unicode: 0x0DA1
      signs: [alSign, iSign, iiSign, raSign, rephSign]
      touch: [ja, jha]
    jha:
      unicode: 0x0DA2
      signs: [alSign, iSign, iiSign, raSign, rephSign]
    nya:
      unicode: 0x0DA3
      signs: [alSign, iSign, iiSign, raSign, rephSign]
      ligate: [ca, cha, ja]
      touch: [ca, nya]
    # jnya:
    # nyja:
    tta:
      unicode: 0x0DA4
      signs: [alSign, iSign, iiSign, raSign, rephSign]
      ligate: [ttha]
      touch: [tta, ttha]
    ttha:
      unicode: 0x0DA5
      signs: [alSign, iSign, iiSign, raSign, rephSign]
    dda:
      unicode: 0x0DA6
      signs: [alSign, iSign, iiSign, raSign, rephSign]
      ligate: [dha]
      touch: [dda, ddha]
    ddha:
      unicode: 0x0DA7
      signs: [alSign, iSign, iiSign, raSign, rephSign]
    nna:
      unicode: 0x0DA8
      signs: [alSign, iSign, iiSign, rephSign]
      ligate: [dda]
      touch: [nna, dda, ttha, ha]
    nndda:
      unicode: 0x0DA9
      signs: [alSign, iSign, iiSign, raSign, rephSign]
    ta:
      unicode: 0x0DAA
      signs: [alSign, iSign, iiSign, raSign, rephSign]
      ligate: [tha, va]
      touch: [ta, tha, ma, va]
    tha:
      unicode: 0x0DAB
      signs: [alSign, iSign, iiSign, raSign, rephSign]
    da:
      unicode: 0x0DAC
      signs: [alSign, iSign, iiSign, raSign, rephSign]
      ligate: [dha, va]
      touch: [da, dha, va]
    dha:
      unicode: 0x0DAD
      signs: [alSign, iSign, iiSign, raSign, rephSign]
    na:
      unicode: 0x0DAE
      signs: [alSign, iSign, iiSign, raSign, rephSign]
      ligate: [tha, da, dha, va]
      touch: [na, tta, ta, da, dha, tha, va, ha]
    nda:
      unicode: 0x0DAF
      signs: [alSign, iSign, iiSign, raSign, rephSign]
    pa:
      unicode: 0x0DB0
      signs: [alSign, iSign, iiSign, raSign, rephSign]
      touch: [pa, ta, pha, ba, da, ha]
    pha:
      unicode: 0x0DB1
      signs: [alSign, iSign, iiSign, raSign, rephSign]
    ba:
      unicode: 0x0DB2
      signs: [alSign, iSign, iiSign, raSign, rephSign]
      ligate: [ba]
      touch: [ba, da, bha]
    bha:
      unicode: 0x0DB3
      signs: [alSign, iSign, iiSign, raSign, rephSign]
    ma:
      unicode: 0x0DB4
      signs: [alSign, iSign, iiSign, raSign, rephSign]
      ligate: [ba]
      touch: [ma, ha, pha, ba, va, pa, da, bha]
    mba:
      unicode: 0x0DB5
      signs: [alSign, iSign, iiSign, raSign, rephSign]
    ya:
      unicode: 0x0DB6
      signs: [alSign, iSign, iiSign, raSign, rephSign]
    ra:
      unicode: 0x0DB7
      signs: [alSign, iSign, iiSign]
    la:
      unicode: 0x0DB8
      signs: [alSign, iSign, iiSign, rephSign]
      touch: [la, va]
    va:
      unicode: 0x0DBA
      signs: [alSign, iSign, iiSign, raSign, rephSign]
      touch: [ha]
    sha:
      unicode: 0x0DBB
      signs: [alSign, iSign, iiSign, raSign, rephSign]
      touch: [tta]
    ssa:
      unicode: 0x0DBD
      signs: [alSign, iSign, iiSign, raSign, rephSign]
    sa:
      unicode: 0x0DBE
      signs: [alSign, iSign, iiSign, raSign, rephSign]
      touch: [sa, ta, va]
    ha:
      unicode: 0x0DBF
      signs: [alSign, iSign, iiSign, raSign, rephSign]
      touch: [ma]
    lla:
      unicode: 0x0DC0
      signs: [alSign, iSign, iiSign, raSign, rephSign]
    fa:
      unicode: 0x0DC1
      signs: [alSign, iSign, iiSign, raSign, rephSign]
  Signs:
    aaSign: # ා (aela-pilla)
      unicode: 0x0DCF
    aeSign: # ැ (aeda-pilla)
      unicode: 0x0DD0
    aaeSign: # ෑ (diga aeda-pilla)
      unicode: 0x0DD1
    iSign: # ි (is-pilla)
      unicode: 0x0DD2
    iiSign: # ී (diga is-pilla)
      unicode: 0x0DD3
    uSign: # ු (paa-pilla)
      unicode: 0x0DD4
    uuSign: # ූ (diga paa-pilla)
      unicode: 0x0DD6
    eSign: # ෙ (kombuwa)
      unicode: 0x0DD9
    eeSign: # ේ (diga kombuwa )
      unicode: 0x0DDA
      decompose: [eSign, eSign]
    oSign: # ො (kombuwa + aela-pilla)
      unicode: 0x0DDC
    ooSign: # ෝ (kombuwa + diga aela-pilla)
      unicode: 0x0DDD
    aiSign: # ෛ (kombu deka )
      unicode: 0x0DDB
    auSign: # ෞ (kombuwa + gaetta-pilla)
      unicode: 0x0DDE
      decompose: [eSign, vocalicLSign]
    alSign: # ් (al-lakuna)
      unicode: 0x0DCA
    anusvara: # ං (binduwa)
      unicode: 0x0D82
    visarga: # ඃ (visargaya)
      unicode: 0x0D83
    raSign: # ්‍ර (rakaransaya)
    rephSign: # ර්‍ (repaya)
    yaSign: # ්‍ය (yansaya)
    uSign.rakar: # ්‍රු (uSign following rakar)
    uuSign.rakar: # ්‍රූ (uuSign following rakar)
    ooSign.half: # ෝ් (kombu deka + aela-pilla + al-lakuna)

  Ligated consonant conjuncts:
  # kernal set ommits all Ligated consonant conjuncts or සංයෝග අකුරු *sanyoga akuru*

  Orthographical conjuncts:
    # Note: Orthographical Conjunct ligatures are REQUIRED and mandatory to be included in order to produce a functioning Sinhala font.
    # Naming: drop trailing 'a' from base consonant, add sign abbreviation

    # alSign Ligatures, pure consonant without inhersnt vowel (al-lakuna):
    kh: # ඛ්
    ngg: # ඞ්
    c: # ච්
    ch: # ඡ්
    j: # ජ්
    jh: # ඣ්
    #jny:
    #nyj:
    tt: # ට්
    tth: # ඨ්
    dd: # ඩ්
    ddh: # ඪ්
    nndd: # ඬ්
    th: # ථ්
    dh: # ධ්
    ph: # ඵ්
    b: # බ්
    m: # ම්
    mb: # ඹ්
    r: # ර්
    v: # ව්

    # iSign Ligatures (is-pilla):
    khi: # ඛි
    nggi: # ඞි
    ci: # චි
    chi: # ඡි
    ji: # ජි
    jhi: # ඣි
    #nyji:
    tti: # ටි
    tthi: # ඨි
    ddi: # ඩි
    ddhi: # ඪි
    nnddi: # ඬි
    thi: # ථි
    dhi: # ධි
    phi: # ඵි
    bi: # බි
    mi: # මි
    mbi: # ඹි
    ri: # රි
    vi: # වි

    # iiSign Ligatures (diga is-pilla):
    khii: # ඛී
    nggii: # ඞී
    cii: # චී
    chii: # ඡී
    jii: # ජී
    jhii: # ඣී
    #jnyii:
    #nyjii:
    ttii: # ටී
    tthii: # ඨී
