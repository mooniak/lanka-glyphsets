languages: [Sinhala, Pali, Sanskrit]

description: The "Mooniak Sinhala Pro" glyphset provides complete coverage including historical forms, rare conjuncts, and full Pali/Sanskrit support for classical texts.

namespace: sinh  # suffix convention: glyphs are named as "name-sinh" (e.g. ka-sinh)

categories:
  Format controls:

  Punctuation:

  Letters:

  Signs:
    candrabindu:

  Sinhala numerals:
    # Lith digits (ලිත් ඉලක්කම්) — astrological/almanac digits, U+0DE6–U+0DEF.
    # A positional decimal set, so it includes a zero.
    lithzero: # ෦
      unicode: 0x0DE6
    lithone: # ෧
      unicode: 0x0DE7
    lithtwo: # ෨
      unicode: 0x0DE8
    liththree: # ෩
      unicode: 0x0DE9
    lithfour: # ෪
      unicode: 0x0DEA
    lithfive: # ෫
      unicode: 0x0DEB
    lithsix: # ෬
      unicode: 0x0DEC
    lithseven: # ෭
      unicode: 0x0DED
    litheight: # ෮
      unicode: 0x0DEE
    lithnine: # ෯
      unicode: 0x0DEF

    # Archaic numbers (පුරාණ ඉලක්කම්), U+111E1–U+111F4 (Sinhala Archaic Numbers
    # block, supplementary plane). Additive, not positional — hence no zero, and
    # distinct signs for the tens, one hundred and one thousand.
    archaicone:
      unicode: 0x111E1
    archaictwo:
      unicode: 0x111E2
    archaicthree:
      unicode: 0x111E3
    archaicfour:
      unicode: 0x111E4
    archaicfive:
      unicode: 0x111E5
    archaicsix:
      unicode: 0x111E6
    archaicseven:
      unicode: 0x111E7
    archaiceight:
      unicode: 0x111E8
    archaicnine:
      unicode: 0x111E9
    archaicten:
      unicode: 0x111EA
    archaictwenty:
      unicode: 0x111EB
    archaicthirty:
      unicode: 0x111EC
    archaicforty:
      unicode: 0x111ED
    archaicfifty:
      unicode: 0x111EE
    archaicsixty:
      unicode: 0x111EF
    archaicseventy:
      unicode: 0x111F0
    archaiceighty:
      unicode: 0x111F1
    archaicninety:
      unicode: 0x111F2
    archaiconehundred:
      unicode: 0x111F3
    archaiconethousand:
      unicode: 0x111F4

  Ligated consonant conjuncts:
    # Rare ligated consonant conjuncts (සංයෝග අකුරු Sanyoga Akuru)
    ngDha: # ඞ්‍ධ (nga + dha)
    ttTtha: # ට්‍ඨ (tta + ttha)
    ddDha: # ඩ්‍ධ (dda + dha)
    dVa: # ද්‍ව (da + va)
    nVa: # න්‍ව (na + va)
    nyCa: # ඤ්‍ච (nya + ca)
    nyCha: # ඤ්‍ඡ (nya + cha)
    nyJa: # ඤ්‍ජ (nya + ja)
    nnDda: # ණ්‍ඩ (nna + dda)
    anusvarayaSha: # ං + ශ (anusvaraya + sha)

  Stylistic alternates:
    ss01 Da Forms: # Stylistic alternate forms of Da + signs with below-base forms
      daa._c: # දා (da + aasign below-base)
      daa_virama._c: # දා් (da + aasign + virama below-base)
      dae._c: # දැ (da + aesign below-base)
      daae._c: # දෑ (da + aaesign below-base)
      dvocalicr._c: # ද + vocalicrsign below-base
      dvocalicrr._c: # ද + vocalicrrsign below-base
      dya._c: # ද්‍ය (da + yasign below-base)
      dy._c: # ද්‍ය් (da + yasign + virama below-base)
      dyaa._c: # ද්‍යා (da + yasign + aasign below-base)
      dyaa_virama._c: # ද්‍යා් (da + yasign + aasign + virama below-base)
      dyU._c: # ද්‍යු (da + yasign + usign below-base)
      dyUu._c: # ද්‍යූ (da + yasign + uusign below-base)
      nDaa._c: # න්‍දා (nDa + aasign below-base)
      nDaa_virama._c: # න්‍දා් (nDa + aasign + virama below-base)
      nDae._c: # න්‍දැ (nDa + aesign below-base)
      nDaae._c: # න්‍දෑ (nDa + aaesign below-base)
      nDvocalicr._c: # න්‍ද + vocalicrsign below-base
      nDvocalicrr._c: # න්‍ද + vocalicrrsign below-base
      nyaa._c: # ඤා (nya + aasign below-base)
      nyaa_virama._c: # ඤා් (nya + aasign + virama below-base)
      nyae._c: # ඤැ (nya + aesign below-base)
      nyaae._c: # ඤෑ (nya + aaesign below-base)
      nyJaa._c: # ඤ්‍ජා (nyJa + aasign below-base)
      nyJaa_virama._c: # ඤ්‍ජා් (nyJa + aasign + virama below-base)
      nyJae._c: # ඤ්‍ජැ (nyJa + aesign below-base)
      nyJaae._c: # ඤ්‍ජෑ (nyJa + aaesign below-base)
      dRaa._c: # ද්‍රා (da + rasign + aasign below-base)
      nDRaa._c: # න්‍ද්‍රා (nDa + rasign + aasign below-base)

  ss02 Fa: # ප+f alternate
      fPa:
      fPI:
      fPIi:

  ss03 Historical forms:
      esign._ui: # Historical Kombuwa
