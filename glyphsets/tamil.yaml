languages: [Tamil]

description: The "Mooniak Tamil" glyphset defines the Tamil coverage for fonts targeting Sri Lankan (and wider) Tamil users, named under the LankaGlyphset standard. Unicode values follow the Tamil block (U+0B80–U+0BFF).

namespace: taml  # suffix convention: glyphs are named as "name-taml" (e.g. ka-taml)

